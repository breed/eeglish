# nginx config for mcp.inglish.us -> inglish MCP server on 127.0.0.1:8000
#
# install:
#   sudo cp deploy/nginx-mcp.conf /etc/nginx/sites-available/inglish-mcp
#   sudo ln -s /etc/nginx/sites-available/inglish-mcp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mcp.inglish.us   # adds the TLS bits
#
# the limit_req_zone line must live at http{} scope, which sites-enabled
# includes satisfy. rate limit: 10 req/s per client IP with a burst of 20 —
# generous for MCP clients, hostile to hammering.

limit_req_zone $binary_remote_addr zone=inglish_mcp:10m rate=10r/s;

# refuse requests that arrive with the wrong Host header (blocks DNS-rebinding
# and stray-IP traffic from ever reaching the MCP server)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.inglish.us;
    # certbot --nginx will convert this block to TLS and add the redirect

    location /mcp {
        limit_req zone=inglish_mcp burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # streamable HTTP responses are SSE: flush immediately, allow long streams
        proxy_buffering off;
        proxy_read_timeout 3600s;

        # translate payloads are text; 2m is plenty
        client_max_body_size 2m;
    }

    # everything else on this vhost is a 404 — only /mcp is served
    location / {
        return 404;
    }
}
